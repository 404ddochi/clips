<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include "components/seo_meta.html" %}
  <link rel="icon" href="{{ absolute_url('/static/favicon/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='css/reset.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}">
  {% block page_styles %}{% endblock %}
  <script src="{{ url_for('static', path='js/common.js') }}" defer></script>
  {% block page_scripts %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  {% include "components/header.html" %}
  <main id="main-content" class="site-main">
    {% block content %}{% endblock %}
  </main>
  {% include "components/footer.html" %}
</body>
</html>
