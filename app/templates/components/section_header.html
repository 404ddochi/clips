{% from "components/icons.html" import icon %}
<div class="section-header{% if css_class %} {{ css_class }}{% endif %}">
  {% if eyebrow %}
  <p class="section-header__eyebrow">{{ eyebrow }}</p>
  {% endif %}
  <div class="section-header__row">
    <div class="section-header__main">
      <h2 class="section-header__title" {% if title_id %}id="{{ title_id }}"{% endif %}>{{ title }}</h2>
      {% if description %}
      <p class="section-header__desc">{{ description }}</p>
      {% endif %}
    </div>
    {% if more_url and more_label %}
    <a class="section-header__more" href="{{ more_url }}">
      {{ more_label }}
      <span aria-hidden="true">{{ icon("arrow", size=14) }}</span>
    </a>
    {% endif %}
  </div>
</div>
