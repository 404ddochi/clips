<title>{{ seo_title }}</title>
<meta name="description" content="{{ seo_description }}">
{% if seo_canonical_url %}
<link rel="canonical" href="{{ seo_canonical_url }}">
{% endif %}
<meta name="robots" content="{{ seo_robots }}">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080b12">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3efe6">
<meta property="og:type" content="{{ seo_og_type }}">
<meta property="og:locale" content="{{ seo_og_locale }}">
<meta property="og:site_name" content="CLIPS">
<meta property="og:title" content="{{ seo_og_title }}">
<meta property="og:description" content="{{ seo_og_description }}">
{% if seo_og_url %}
<meta property="og:url" content="{{ seo_og_url }}">
{% endif %}
{% if seo_og_image %}
<meta property="og:image" content="{{ seo_og_image }}">
{% if seo_og_image_secure_url %}
<meta property="og:image:secure_url" content="{{ seo_og_image_secure_url }}">
{% endif %}
<meta property="og:image:type" content="{{ seo_og_image_type }}">
<meta property="og:image:width" content="{{ seo_og_image_width }}">
<meta property="og:image:height" content="{{ seo_og_image_height }}">
<meta property="og:image:alt" content="{{ seo_og_image_alt }}">
{% endif %}
<meta name="twitter:card" content="{{ seo_twitter_card }}">
<meta name="twitter:title" content="{{ seo_twitter_title }}">
<meta name="twitter:description" content="{{ seo_twitter_description }}">
{% if seo_twitter_image %}
<meta name="twitter:image" content="{{ seo_twitter_image }}">
<meta name="twitter:image:alt" content="{{ seo_twitter_image_alt }}">
{% endif %}
{% include "components/structured_data.html" %}
